# Запуск: cd backend && cp .env.example .env && docker compose up -d --build
name: ai-clinic

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clinic}
      POSTGRES_USER: ${POSTGRES_USER:-clinic}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-clinic}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-clinic}
      SECRET_KEY: ${SECRET_KEY:?задайте SECRET_KEY в .env}
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: backend/web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    # Наружу только на localhost: на VPS перед ним стоит системный nginx с HTTPS.
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"

volumes:
  pgdata:
